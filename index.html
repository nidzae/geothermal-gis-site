<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geothermal GIS — sign in</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; background:#101725; color:#e8ecf2; }
  .card { background:#1a2434; border:1px solid #2b3a52; border-radius:10px; padding:32px 36px; width:340px; }
  h1 { font-size:17px; margin:0 0 18px; }
  input { width:100%; padding:10px 12px; border-radius:6px; border:1px solid #2b3a52;
          background:#101725; color:#e8ecf2; font-size:15px; }
  button { width:100%; margin-top:12px; padding:10px; border:none; border-radius:6px;
           background:#2f6fd6; color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:#e2766a; font-size:13px; margin-top:10px; min-height:18px; }
</style>
</head>
<body>
<div class="card">
  <h1>Geothermal Lease &amp; Resource GIS</h1>
  <input id="pw" type="password" placeholder="Password" autofocus>
  <button id="go">Open map</button>
  <div class="err" id="err"></div>
</div>
<script>
const SALT = "SjJ3d3NHyj+9QCHbaRY2nA==", IV = "5vHST05zmveltjOO", ITER = 310000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const pw = document.getElementById("pw").value;
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const ct = b64(document.getElementById("payload").textContent);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, ct);
    const html = new TextDecoder().decode(pt);
    window.__CHUNK_KEY__ = key;  // survives document.write; app decrypts records.bin with it
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = "Wrong password.";
    btn.disabled = false;
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
</script>
